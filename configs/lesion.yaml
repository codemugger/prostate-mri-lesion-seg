# Five-fold T2+ADC+HIGHB lesion training. Select the fold on the CLI.
dataset:
  manifest: artifacts/training/training_manifest.csv
  split_csv: artifacts/training/lesion_splits.csv
  # Persistent, invalidation-aware preprocessing cache; safe to reuse across folds.
  cache_dir: artifacts/training/lesion_cache
  num_workers: 4
  source_sampling_weights: null

# Mirrors custom_lesion_seg_operator.py, including its ROI convention.
preprocess:
  spacing: [0.5, 0.5, 0.5]
  roi_margin: 32
  patch_size: [128, 128, 32]
  samples_per_case: 4
  positive_fraction: 0.67

augment:
  enabled: true

# Exact strict-load architecture used by the current five inference folds.
model:
  type: rrunet3d
  in_channels: 3
  out_channels: 2
  blocks_down: "1,2,3,4"
  blocks_up: "3,2,1"
  num_init_kernels: 32
  recurrent: false
  residual: true
  attention: false
  se: false

train:
  # Conservative transfer-learning schedule used by the completed HIVE folds.
  epochs: 50
  batch_size: 1
  lr: 0.0001
  weight_decay: 0.0001
  amp: true
  seed: 42
  # Effective batch size 2 without increasing peak GPU memory.
  grad_accum_steps: 2
  log_interval: 20
  # Select the best checkpoint on every epoch for this 50-epoch run.
  val_interval: 1

# RRUNet already applies Softmax, so this loss consumes probabilities directly.
loss:
  gamma: 2.0
  alpha: 0.75
  dice_weight: 1.0
  focal_weight: 1.0

optimizer:
  type: adamw

scheduler:
  type: cosine_anneal
  # One monotonic 50-epoch cosine decay; no restarts/cycles.
  t_max: 50
  eta_min: 1.0e-6

validation:
  # Fold selection uses a conventional single-model threshold. The app's
  # five-fold ensemble continues to use its existing 0.63 threshold.
  threshold: 0.5
  ensemble_threshold: 0.63

output:
  exp_dir: experiments/lesion
  save_last_interval: 1
  # Retain a full inference-compatible/resumable checkpoint every 10 epochs.
  snapshot_interval: 10
