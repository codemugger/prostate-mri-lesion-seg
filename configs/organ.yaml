# Binary whole-gland training. Build these files with scripts/prepare_training_data.py.
dataset:
  manifest: artifacts/training/training_manifest.csv
  split_csv: artifacts/training/organ_splits.csv
  cache_rate: 0.05
  num_workers: 4
  # null preserves the natural SGH/ProstateX cohort proportions. Optionally
  # set explicit masses, e.g. {SGH: 0.8, ProstateX: 0.2}.
  source_sampling_weights: null

# Mirrors prostate_mri_lesion_seg_app/organ_seg_operator.py.
preprocess:
  spacing: [1.0, 1.0, 1.0]
  patch_size: [128, 128, 16]
  samples_per_case: 2
  pos_to_neg_ratio: 1.0

# This exact architecture is the deployed binary model.ts contract.
model:
  type: unet
  in_channels: 1
  out_channels: 2
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2
  norm: BATCH

train:
  epochs: 200
  batch_size: 2
  lr: 0.0002
  weight_decay: 0.0001
  amp: true
  seed: 42
  grad_accum_steps: 1
  log_interval: 20
  val_interval: 1

loss:
  include_background: false
  dice_weight: 1.0
  ce_weight: 1.0

optimizer:
  type: adamw

scheduler:
  type: cosine_anneal
  t_max: 200
  eta_min: 1.0e-6

validation:
  roi_size: [128, 128, 16]
  sw_batch_size: 4
  overlap: 0.5

output:
  exp_dir: experiments/organ
  save_last_interval: 1
